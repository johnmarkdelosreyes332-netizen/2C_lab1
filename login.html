<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modern Login</title>
    <style>
      :root {
        --bg-start: #0f172a;
        --bg-end: #1e293b;
        --card-bg: rgba(15, 23, 42, 0.7);
        --panel-bg: rgba(255, 255, 255, 0.08);
        --primary: #8b5cf6;
        --primary-2: #3b82f6;
        --accent: #22c55e;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --border: rgba(148, 163, 184, 0.18);
        --shadow: 0 30px 60px rgba(15, 23, 42, 0.45);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
        color: var(--text);
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .login-shell {
        width: min(1100px, 100%);
        min-height: 680px;
        display: grid;
        grid-template-columns: 1.05fr 0.95fr;
        background: rgba(15, 23, 42, 0.62);
        border: 1px solid var(--border);
        border-radius: 28px;
        box-shadow: var(--shadow);
        overflow: hidden;
        backdrop-filter: blur(12px);
      }

      .brand-panel {
        position: relative;
        padding: 48px 40px;
        background:
          radial-gradient(circle at top left, rgba(139, 92, 246, 0.32), transparent 32%),
          radial-gradient(circle at bottom right, rgba(59, 130, 246, 0.28), transparent 34%),
          linear-gradient(135deg, rgba(15, 23, 42, 0.9), rgba(30, 41, 59, 0.72));
      }

      .brand-panel::before {
        content: "";
        position: absolute;
        inset: 18px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 20px;
      }

      .brand-content {
        position: relative;
        z-index: 1;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .logo {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        font-size: 0.9rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #fff;
      }

      .logo-badge {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--primary), var(--primary-2));
        display: grid;
        place-items: center;
        box-shadow: 0 14px 30px rgba(139, 92, 246, 0.5);
      }

      .logo-badge::before {
        content: "A";
        font-weight: 800;
      }

      .hero-copy {
        max-width: 420px;
        margin-top: 48px;
      }

      .eyebrow {
        display: inline-block;
        padding: 7px 12px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid var(--border);
        color: #dbeafe;
        font-size: 0.72rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 18px 0 16px;
        font-size: clamp(2.5rem, 3.8vw, 4.2rem);
        line-height: 1.06;
        letter-spacing: -0.06em;
      }

      .hero-copy p {
        margin: 0;
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.7;
      }

      .stats {
        display: flex;
        gap: 18px;
        flex-wrap: wrap;
        margin-top: 28px;
      }

      .stat {
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(148, 163, 184, 0.12);
        border-radius: 18px;
        padding: 18px 18px 14px;
        min-width: 130px;
      }

      .stat strong {
        display: block;
        font-size: 1.5rem;
        margin-bottom: 4px;
      }

      .stat span {
        color: var(--muted);
        font-size: 0.8rem;
      }

      .form-panel {
        padding: 42px 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(15, 23, 42, 0.4);
      }

      .form-wrap {
        width: min(100%, 420px);
      }

      .title-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 28px;
      }

      h2 {
        margin: 0;
        font-size: 2rem;
        letter-spacing: -0.05em;
      }

      .tag {
        color: #c4b5fd;
        font-size: 0.8rem;
        font-weight: 600;
        background: rgba(139, 92, 246, 0.12);
        border: 1px solid rgba(139, 92, 246, 0.26);
        border-radius: 999px;
        padding: 8px 12px;
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      label {
        color: #dfe7f5;
        font-size: 0.86rem;
        font-weight: 600;
      }

      .input-box {
        position: relative;
      }

      .input-box input {
        width: 100%;
        border: 1px solid rgba(148, 163, 184, 0.2);
        background: rgba(15, 23, 42, 0.65);
        border-radius: 14px;
        padding: 16px 18px 16px 46px;
        color: var(--text);
        font-size: 1rem;
        transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
      }

      .input-box input::placeholder {
        color: #7c8aa3;
      }

      .input-box input:focus {
        outline: none;
        border-color: rgba(96, 165, 250, 0.9);
        box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.16);
      }

      .input-box i {
        position: absolute;
        top: 50%;
        left: 16px;
        transform: translateY(-50%);
        color: var(--muted);
        font-size: 1rem;
      }

      .options {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        font-size: 0.86rem;
      }

      .remember {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
      }

      .remember input {
        accent-color: var(--primary);
      }

      .link {
        color: #c4b5fd;
        text-decoration: none;
        font-weight: 600;
      }

      .primary-btn {
        border: none;
        border-radius: 14px;
        padding: 16px 18px;
        font-size: 1rem;
        font-weight: 700;
        color: #fff;
        background: linear-gradient(135deg, var(--primary), var(--primary-2));
        box-shadow: 0 18px 30px rgba(96, 165, 250, 0.28);
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .primary-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 20px 32px rgba(96, 165, 250, 0.34);
      }

      .divider {
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--muted);
        font-size: 0.8rem;
        margin: 4px 0;
      }

      .divider::before,
      .divider::after {
        content: "";
        height: 1px;
        background: rgba(148, 163, 184, 0.2);
        flex: 1;
      }

      .socials {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
      }

      .social-btn {
        height: 48px;
        border-radius: 12px;
        border: 1px solid rgba(148, 163, 184, 0.18);
        background: rgba(255, 255, 255, 0.02);
        color: var(--text);
        font-weight: 700;
        cursor: pointer;
        transition: border-color 0.2s ease, background 0.2s ease;
      }

      .social-btn:hover {
        border-color: rgba(96, 165, 250, 0.4);
        background: rgba(96, 165, 250, 0.06);
      }

      .register {
        margin-top: 24px;
        text-align: center;
        color: var(--muted);
        font-size: 0.92rem;
      }

      .register a {
        color: #d8b4fe;
        text-decoration: none;
        font-weight: 700;
      }

      @media (max-width: 860px) {
        .login-shell {
          grid-template-columns: 1fr;
        }

        .brand-panel,
        .form-panel {
          padding: 32px 24px;
        }

        .hero-copy {
          margin-top: 24px;
        }
      }
    </style>
  </head>
  <body>
    <div class="login-shell">
      <section class="brand-panel">
        <div class="brand-content">
          <div class="logo">
            <span class="logo-badge"></span>
            <span>Arbor</span>
          </div>

          <div class="hero-copy">
            <span class="eyebrow">Welcome back</span>
            <h1>Build your next big idea.</h1>
            <p>
              Track progress, review updates, and stay connected with your team in one modern workspace.
            </p>

            <div class="stats">
              <div class="stat">
                <strong>24k+</strong>
                <span>Active users</span>
              </div>
              <div class="stat">
                <strong>98%</strong>
                <span>Satisfaction</span>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="form-panel">
        <div class="form-wrap">
          <div class="title-row">
            <h2>Sign in</h2>
            <span class="tag">Secure</span>
          </div>

          <form>
            <div class="field">
              <label for="email">Email address</label>
              <div class="input-box">
                <i>✉</i>
                <input id="email" type="email" placeholder="name@example.com" />
              </div>
            </div>

            <div class="field">
              <label for="password">Password</label>
              <div class="input-box">
                <i>🔒</i>
                <input id="password" type="password" placeholder="Enter your password" />
              </div>
            </div>

            <div class="options">
              <label class="remember">
                <input type="checkbox" />
                <span>Remember me</span>
              </label>
              <a class="link" href="#">Forgot password?</a>
            </div>

            <button type="submit" class="primary-btn">Log In</button>

            <div class="divider">or continue with</div>

            <div class="socials">
              <button type="button" class="social-btn">Google</button>
              <button type="button" class="social-btn">GitHub</button>
              <button type="button" class="social-btn">Slack</button>
            </div>
          </form>

          <div class="register">
            New here? <a href="#">Create an account</a>
          </div>
        </div>
      </section>
    </div>
  </body>
</html>
